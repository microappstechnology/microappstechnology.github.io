<svg xmlns="http://www.w3.org/2000/svg" width="390" height="820" viewBox="0 0 390 820" role="img" aria-labelledby="title desc"><title id="title">Health Tracker blood pressure history interface preview</title><desc id="desc">Illustrative blood pressure tracker screen with an empty trend chart, history controls, and an add reading button. No personal measurements are shown.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbf9"/><stop offset="1" stop-color="#eef5f1"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183a3322"/></filter></defs><rect x="8" y="8" width="374" height="804" rx="38" fill="#152c2b"/><rect x="17" y="17" width="356" height="786" rx="31" fill="url(#bg)"/><rect x="145" y="17" width="100" height="21" rx="11" fill="#152c2b"/><text x="38" y="62" font-family="Arial,sans-serif" font-size="12" fill="#657976">9:41</text><text x="36" y="113" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#182b32">Blood Pressure</text><text x="36" y="138" font-family="Arial,sans-serif" font-size="13" fill="#647579">Your readings and trends</text><rect x="29" y="164" width="332" height="54" rx="16" fill="#fff"/><text x="49" y="197" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#167c72">Overview</text><text x="148" y="197" font-family="Arial,sans-serif" font-size="13" fill="#647579">History</text><text x="230" y="197" font-family="Arial,sans-serif" font-size="13" fill="#647579">Analysis</text><rect x="29" y="235" width="332" height="259" rx="22" fill="#fff" filter="url(#shadow)"/><text x="51" y="273" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#182b32">Blood pressure trend</text><text x="51" y="295" font-family="Arial,sans-serif" font-size="11" fill="#647579">Review readings by week or month</text><path d="M53 333h284M53 378h284M53 423h284M53 468h284" stroke="#edf1ef"/><path d="M53 326v147" stroke="#dfe8e3"/><text x="52" y="484" font-family="Arial,sans-serif" font-size="10" fill="#87958f">No readings yet</text><rect x="29" y="513" width="332" height="131" rx="22" fill="#fff" filter="url(#shadow)"/><text x="51" y="550" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#182b32">Reading history</text><text x="51" y="578" font-family="Arial,sans-serif" font-size="12" fill="#647579">Your saved entries will appear here.</text><rect x="51" y="596" width="112" height="30" rx="10" fill="#eaf4ef"/><text x="68" y="616" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#167c72">Add a reading</text><rect x="29" y="667" width="332" height="61" rx="18" fill="#167c72"/><circle cx="68" cy="698" r="14" fill="#fff" opacity=".18"/><path d="M68 691v14m-7-7h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="94" y="703" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">Record blood pressure</text><path d="M45 756h300" stroke="#dfe8e3"/><circle cx="82" cy="775" r="5" fill="#b1c0bb"/><circle cx="195" cy="775" r="5" fill="#167c72"/><circle cx="308" cy="775" r="5" fill="#b1c0bb"/></svg>
